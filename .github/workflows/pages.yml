name: Deploy menu to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/ferragosto-menu-qr-jbqyhq
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola pubblicazione alla volta; non annulla un deploy già in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: attiva GitHub Pages sul repo al primo giro, senza passare da Settings
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Carica il sito (root del repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
